services:
  - type: web
    name: terravision-ai
    runtime: python
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build && cd .. && pip install -r requirements.txt
    startCommand: cd backend && PYTHONPATH=. python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: ../model/satellite_cnn.keras
      - key: CORS_ORIGINS
        value: https://terravision-ai.onrender.com
